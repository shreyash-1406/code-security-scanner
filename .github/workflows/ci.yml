name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q
      # The scanner scans its own source code and fails the build on HIGH issues
      - run: python -m secscan secscan --no-quality --fail-on HIGH
